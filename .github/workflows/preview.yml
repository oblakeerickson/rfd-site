name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

env:
  PREVIEW_HOST: preview.blake.app
  PREVIEW_USER: deploy
  BASE_PORT: 3001

jobs:
  deploy-preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Calculate port
        id: port
        run:
          echo "port=$(( ${{ env.BASE_PORT }} + (${{ github.event.pull_request.number }} %
          100) ))" >> $GITHUB_OUTPUT

      - name: Deploy preview
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.PREVIEW_HOST }}
          username: ${{ env.PREVIEW_USER }}
          key: ${{ secrets.PREVIEW_SSH_KEY }}
          script: |
            /home/deploy/scripts/start-preview.sh ${{ github.event.pull_request.number }} "${{ github.head_ref }}" ${{ steps.port.outputs.port }}
            /home/deploy/scripts/update-caddy.sh

      - name: Comment PR with preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const previewUrl = `https://pr-${prNumber}.${{ env.PREVIEW_HOST }}`;
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const botComment = comments.data.find(c =>
              c.user.type === 'Bot' && c.body.includes('Preview deployment')
            );
            const body = `### Preview deployment\n\nYour preview is ready at: ${previewUrl}\n\n_Updated: ${new Date().toISOString()}_`;
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

  cleanup-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup preview
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.PREVIEW_HOST }}
          username: ${{ env.PREVIEW_USER }}
          key: ${{ secrets.PREVIEW_SSH_KEY }}
          script: |
            /home/deploy/scripts/stop-preview.sh ${{ github.event.pull_request.number }}
            /home/deploy/scripts/update-caddy.sh
